<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess AI — New Game</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', -apple-system, sans-serif; }
    body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%); }
    .card-glass {
      background: linear-gradient(135deg, rgba(30,41,59,0.8), rgba(15,23,42,0.9));
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .time-btn.selected { background: linear-gradient(135deg, #3b82f6, #2563eb); border-color: #3b82f6; }
    .mode-btn.selected { background: linear-gradient(135deg, #3b82f6, #2563eb); border-color: #3b82f6; }
  </style>
</head>
<body class="min-h-screen text-white">
  <!-- Navigation -->
  <nav class="sticky top-0 z-50 backdrop-blur-xl bg-slate-900/80 border-b border-slate-800/50">
    <div class="max-w-6xl mx-auto px-4 sm:px-6">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center gap-8">
          <a href="01-home.html" class="flex items-center gap-2 font-bold text-xl">
            <span class="text-3xl">♞</span>
            <span class="bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">Chess AI</span>
          </a>
          <div class="hidden lg:flex items-center gap-6 text-slate-400">
            <a href="01-home.html" class="flex items-center gap-2 hover:text-white transition">
              <i data-lucide="home" class="w-4 h-4"></i> Home
            </a>
            <a href="#" class="flex items-center gap-2 text-white font-medium">
              <i data-lucide="plus" class="w-4 h-4"></i> New Game
            </a>
            <a href="05-library.html" class="flex items-center gap-2 hover:text-white transition">
              <i data-lucide="folder" class="w-4 h-4"></i> Library
            </a>
            <a href="07-history.html" class="flex items-center gap-2 hover:text-white transition">
              <i data-lucide="scroll-text" class="w-4 h-4"></i> History
            </a>
          </div>
        </div>
        <a href="08-settings.html" class="p-2 hover:bg-slate-800 rounded-lg transition text-slate-400 hover:text-white">
          <i data-lucide="settings" class="w-5 h-5"></i>
        </a>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-2xl mx-auto px-4 py-8 pb-24 lg:pb-12">
    <h1 class="text-3xl font-bold mb-8 text-center">New Game</h1>

    <!-- Game Mode Selection -->
    <div class="card-glass rounded-2xl p-6 mb-6">
      <h2 class="font-semibold text-lg mb-4 flex items-center gap-2">
        <i data-lucide="gamepad-2" class="w-5 h-5 text-blue-400"></i>
        Game Mode
      </h2>
      <div class="grid grid-cols-3 gap-3">
        <button class="mode-btn selected flex flex-col items-center gap-2 p-4 rounded-xl border border-slate-700 transition hover:border-blue-500/50">
          <i data-lucide="bot" class="w-8 h-8 text-blue-400"></i>
          <span class="text-sm font-medium">vs AI</span>
        </button>
        <button class="mode-btn flex flex-col items-center gap-2 p-4 rounded-xl border border-slate-700 transition hover:border-blue-500/50 bg-slate-800/50">
          <i data-lucide="users" class="w-8 h-8 text-emerald-400"></i>
          <span class="text-sm font-medium">vs Human</span>
        </button>
        <button class="mode-btn flex flex-col items-center gap-2 p-4 rounded-xl border border-slate-700 transition hover:border-blue-500/50 bg-slate-800/50">
          <i data-lucide="eye" class="w-8 h-8 text-purple-400"></i>
          <span class="text-sm font-medium">AI vs AI</span>
        </button>
      </div>
    </div>

    <!-- Play As Selection -->
    <div class="card-glass rounded-2xl p-6 mb-6">
      <h2 class="font-semibold text-lg mb-4 flex items-center gap-2">
        <i data-lucide="palette" class="w-5 h-5 text-amber-400"></i>
        Play As
      </h2>
      <div class="grid grid-cols-3 gap-3">
        <button class="flex flex-col items-center gap-2 p-4 rounded-xl border border-blue-500 bg-gradient-to-br from-blue-600/20 to-blue-800/20 transition">
          <div class="w-10 h-10 bg-white rounded-full"></div>
          <span class="text-sm font-medium">White</span>
        </button>
        <button class="flex flex-col items-center gap-2 p-4 rounded-xl border border-slate-700 transition hover:border-slate-600 bg-slate-800/50">
          <div class="w-10 h-10 bg-slate-900 rounded-full border-2 border-slate-600"></div>
          <span class="text-sm font-medium">Black</span>
        </button>
        <button class="flex flex-col items-center gap-2 p-4 rounded-xl border border-slate-700 transition hover:border-slate-600 bg-slate-800/50">
          <i data-lucide="shuffle" class="w-10 h-10 text-slate-400"></i>
          <span class="text-sm font-medium">Random</span>
        </button>
      </div>
    </div>

    <!-- Time Control -->
    <div class="card-glass rounded-2xl p-6 mb-6">
      <h2 class="font-semibold text-lg mb-4 flex items-center gap-2">
        <i data-lucide="clock" class="w-5 h-5 text-cyan-400"></i>
        Time Control
      </h2>
      <div class="grid grid-cols-4 gap-2 mb-4">
        <button class="time-btn py-3 px-2 rounded-lg border border-slate-700 bg-slate-800/50 text-sm font-medium hover:border-blue-500/50 transition">
          <div class="text-lg">1+0</div>
          <div class="text-xs text-slate-500">Bullet</div>
        </button>
        <button class="time-btn py-3 px-2 rounded-lg border border-slate-700 bg-slate-800/50 text-sm font-medium hover:border-blue-500/50 transition">
          <div class="text-lg">2+1</div>
          <div class="text-xs text-slate-500">Bullet</div>
        </button>
        <button class="time-btn py-3 px-2 rounded-lg border border-slate-700 bg-slate-800/50 text-sm font-medium hover:border-blue-500/50 transition">
          <div class="text-lg">3+2</div>
          <div class="text-xs text-slate-500">Blitz</div>
        </button>
        <button class="time-btn selected py-3 px-2 rounded-lg border border-slate-700 text-sm font-medium transition">
          <div class="text-lg">5+0</div>
          <div class="text-xs text-blue-200">Blitz</div>
        </button>
      </div>
      <div class="grid grid-cols-4 gap-2">
        <button class="time-btn py-3 px-2 rounded-lg border border-slate-700 bg-slate-800/50 text-sm font-medium hover:border-blue-500/50 transition">
          <div class="text-lg">10+0</div>
          <div class="text-xs text-slate-500">Rapid</div>
        </button>
        <button class="time-btn py-3 px-2 rounded-lg border border-slate-700 bg-slate-800/50 text-sm font-medium hover:border-blue-500/50 transition">
          <div class="text-lg">15+10</div>
          <div class="text-xs text-slate-500">Rapid</div>
        </button>
        <button class="time-btn py-3 px-2 rounded-lg border border-slate-700 bg-slate-800/50 text-sm font-medium hover:border-blue-500/50 transition">
          <div class="text-lg">30+0</div>
          <div class="text-xs text-slate-500">Classical</div>
        </button>
        <button class="time-btn py-3 px-2 rounded-lg border border-slate-700 bg-slate-800/50 text-sm font-medium hover:border-blue-500/50 transition">
          <div class="text-lg"><i data-lucide="infinity" class="w-5 h-5 mx-auto"></i></div>
          <div class="text-xs text-slate-500">Unlimited</div>
        </button>
      </div>
    </div>

    <!-- AI Personality Selection -->
    <div class="card-glass rounded-2xl p-6 mb-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-semibold text-lg flex items-center gap-2">
          <i data-lucide="brain" class="w-5 h-5 text-purple-400"></i>
          AI Personality
        </h2>
        <a href="04-ai-editor.html" class="text-sm text-blue-400 hover:text-blue-300 flex items-center gap-1">
          <i data-lucide="plus" class="w-4 h-4"></i> Create New
        </a>
      </div>
      
      <!-- Personality Cards -->
      <div class="space-y-2">
        <button class="w-full flex items-center gap-4 p-4 rounded-xl border border-blue-500 bg-gradient-to-r from-blue-600/20 to-transparent transition text-left">
          <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-red-500 to-orange-500 flex items-center justify-center flex-shrink-0">
            <i data-lucide="swords" class="w-6 h-6 text-white"></i>
          </div>
          <div class="flex-1 min-w-0">
            <p class="font-medium">Aggressive</p>
            <p class="text-sm text-slate-400 truncate">High attack weight, sacrifices for initiative</p>
          </div>
          <i data-lucide="check" class="w-5 h-5 text-blue-400 flex-shrink-0"></i>
        </button>

        <button class="w-full flex items-center gap-4 p-4 rounded-xl border border-slate-700 bg-slate-800/30 hover:border-slate-600 transition text-left">
          <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-blue-500 to-cyan-500 flex items-center justify-center flex-shrink-0">
            <i data-lucide="shield" class="w-6 h-6 text-white"></i>
          </div>
          <div class="flex-1 min-w-0">
            <p class="font-medium">Defensive</p>
            <p class="text-sm text-slate-400 truncate">Prioritizes king safety and solid structure</p>
          </div>
        </button>

        <button class="w-full flex items-center gap-4 p-4 rounded-xl border border-slate-700 bg-slate-800/30 hover:border-slate-600 transition text-left">
          <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-amber-500 to-yellow-500 flex items-center justify-center flex-shrink-0">
            <i data-lucide="crown" class="w-6 h-6 text-white"></i>
          </div>
          <div class="flex-1 min-w-0">
            <p class="font-medium">Classical</p>
            <p class="text-sm text-slate-400 truncate">Balanced, standard piece values</p>
          </div>
        </button>
      </div>
      
      <button class="w-full mt-3 text-sm text-slate-400 hover:text-white py-2 flex items-center justify-center gap-1">
        <i data-lucide="chevron-down" class="w-4 h-4"></i>
        Show more personalities
      </button>
    </div>

    <!-- Start Game Button -->
    <button class="w-full bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-emerald-500 hover:to-emerald-400 text-white font-semibold py-4 px-6 rounded-xl transition flex items-center justify-center gap-2 text-lg shadow-lg shadow-emerald-500/25">
      <i data-lucide="play" class="w-6 h-6"></i>
      Start Game
    </button>
  </main>

  <!-- Mobile Bottom Nav -->
  <nav class="lg:hidden fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-xl border-t border-slate-800/50 px-2 py-2 z-50">
    <div class="flex justify-around items-center">
      <a href="01-home.html" class="flex flex-col items-center gap-1 px-3 py-2 text-slate-400">
        <i data-lucide="home" class="w-5 h-5"></i>
        <span class="text-xs">Home</span>
      </a>
      <a href="#" class="flex flex-col items-center gap-1 px-3 py-2 text-white">
        <i data-lucide="plus-circle" class="w-5 h-5"></i>
        <span class="text-xs">Play</span>
      </a>
      <a href="05-library.html" class="flex flex-col items-center gap-1 px-3 py-2 text-slate-400">
        <i data-lucide="folder" class="w-5 h-5"></i>
        <span class="text-xs">Library</span>
      </a>
      <a href="07-history.html" class="flex flex-col items-center gap-1 px-3 py-2 text-slate-400">
        <i data-lucide="scroll-text" class="w-5 h-5"></i>
        <span class="text-xs">History</span>
      </a>
      <a href="08-settings.html" class="flex flex-col items-center gap-1 px-3 py-2 text-slate-400">
        <i data-lucide="settings" class="w-5 h-5"></i>
        <span class="text-xs">Settings</span>
      </a>
    </div>
  </nav>

  <script>lucide.createIcons();</script>
</body>
</html>
