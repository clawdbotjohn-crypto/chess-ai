<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess AI — Game Board (Minimal)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', -apple-system, sans-serif; }
    body { background: #121212; }
    .card-minimal {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
    }
    /* Minimal green-accented board */
    .square-light { background: #eeeed2; }
    .square-dark { background: #769656; }
    .square-highlight { 
      background: #baca44 !important;
    }
    .square-last-move { 
      background: #f6f669 !important;
    }
    .board-container {
      border: 4px solid #2a2a2a;
      border-radius: 4px;
    }
    .piece { 
      font-size: 2.5rem; 
      cursor: grab; 
      user-select: none;
    }
    @media (min-width: 1024px) { .piece { font-size: 3.5rem; } }
    .active-turn { border-left: 3px solid #769656; }
  </style>
</head>
<body class="min-h-screen text-white">
  <!-- Minimal Game Header -->
  <header class="bg-[#1a1a1a] border-b border-[#2a2a2a] sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <a href="01-home.html" class="text-gray-500 hover:text-white transition">
          <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </a>
        <div class="flex items-center gap-2">
          <span class="text-2xl text-[#769656]">♞</span>
          <span class="font-semibold hidden sm:inline text-white">Chess AI</span>
        </div>
      </div>
      <div class="flex items-center gap-1">
        <button class="p-2.5 hover:bg-[#2a2a2a] rounded transition text-gray-500 hover:text-white" title="Sound">
          <i data-lucide="volume-2" class="w-5 h-5"></i>
        </button>
        <button class="p-2.5 hover:bg-[#2a2a2a] rounded transition text-gray-500 hover:text-white" title="Flip board">
          <i data-lucide="flip-vertical" class="w-5 h-5"></i>
        </button>
        <button class="p-2.5 hover:bg-[#2a2a2a] rounded transition text-gray-500 hover:text-white" title="Settings">
          <i data-lucide="settings" class="w-5 h-5"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Game Area -->
  <main class="max-w-7xl mx-auto px-4 py-6">
    <div class="flex flex-col lg:flex-row gap-6">
      
      <!-- Left: Board + Players -->
      <div class="flex-1 flex flex-col items-center">
        <!-- Opponent Info -->
        <div class="w-full max-w-lg mb-2 flex items-center justify-between px-1">
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded bg-gradient-to-br from-red-500 to-orange-500 flex items-center justify-center">
              <i data-lucide="bot" class="w-4 h-4 text-white"></i>
            </div>
            <div>
              <p class="font-medium text-sm">Aggressive <span class="text-gray-500 font-normal">• AI</span></p>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <div class="flex items-center text-lg">
              <span>♙♙♘</span>
              <span class="text-gray-600 ml-1 text-sm">+3</span>
            </div>
            <div class="bg-[#1a1a1a] border border-[#2a2a2a] px-3 py-1.5 rounded font-mono text-xl font-medium">
              4:32
            </div>
          </div>
        </div>

        <!-- Chess Board -->
        <div class="w-full max-w-lg aspect-square board-container overflow-hidden">
          <div class="grid grid-cols-8 h-full">
            <!-- Row 8 -->
            <div class="square-light flex items-center justify-center"><span class="piece">♜</span></div>
            <div class="square-dark flex items-center justify-center"><span class="piece">♞</span></div>
            <div class="square-light flex items-center justify-center"><span class="piece">♝</span></div>
            <div class="square-dark flex items-center justify-center"><span class="piece">♛</span></div>
            <div class="square-light flex items-center justify-center"><span class="piece">♚</span></div>
            <div class="square-dark flex items-center justify-center"><span class="piece">♝</span></div>
            <div class="square-light flex items-center justify-center"><span class="piece">♞</span></div>
            <div class="square-dark flex items-center justify-center"><span class="piece">♜</span></div>
            <!-- Row 7 -->
            <div class="square-dark flex items-center justify-center"><span class="piece">♟</span></div>
            <div class="square-light flex items-center justify-center"><span class="piece">♟</span></div>
            <div class="square-dark flex items-center justify-center"><span class="piece">♟</span></div>
            <div class="square-light flex items-center justify-center"><span class="piece">♟</span></div>
            <div class="square-dark flex items-center justify-center"><span class="piece">♟</span></div>
            <div class="square-light flex items-center justify-center"><span class="piece">♟</span></div>
            <div class="square-dark flex items-center justify-center"><span class="piece">♟</span></div>
            <div class="square-light flex items-center justify-center"><span class="piece">♟</span></div>
            <!-- Row 6 -->
            <div class="square-light flex items-center justify-center"></div>
            <div class="square-dark flex items-center justify-center"></div>
            <div class="square-light flex items-center justify-center"></div>
            <div class="square-dark flex items-center justify-center"></div>
            <div class="square-light flex items-center justify-center"></div>
            <div class="square-dark flex items-center justify-center"></div>
            <div class="square-light flex items-center justify-center"></div>
            <div class="square-dark flex items-center justify-center"></div>
            <!-- Row 5 -->
            <div class="square-dark flex items-center justify-center"></div>
            <div class="square-light flex items-center justify-center"></div>
            <div class="square-dark flex items-center justify-center"></div>
            <div class="square-light flex items-center justify-center"></div>
            <div class="square-highlight flex items-center justify-center"><span class="piece">♙</span></div>
            <div class="square-light flex items-center justify-center"></div>
            <div class="square-dark flex items-center justify-center"></div>
            <div class="square-light flex items-center justify-center"></div>
            <!-- Row 4 -->
            <div class="square-light flex items-center justify-center"></div>
            <div class="square-dark flex items-center justify-center"></div>
            <div class="square-light flex items-center justify-center"></div>
            <div class="square-last-move flex items-center justify-center"></div>
            <div class="square-light flex items-center justify-center"></div>
            <div class="square-dark flex items-center justify-center"></div>
            <div class="square-light flex items-center justify-center"></div>
            <div class="square-dark flex items-center justify-center"></div>
            <!-- Row 3 -->
            <div class="square-dark flex items-center justify-center"></div>
            <div class="square-light flex items-center justify-center"></div>
            <div class="square-dark flex items-center justify-center"><span class="piece">♘</span></div>
            <div class="square-light flex items-center justify-center"></div>
            <div class="square-dark flex items-center justify-center"></div>
            <div class="square-light flex items-center justify-center"></div>
            <div class="square-dark flex items-center justify-center"></div>
            <div class="square-light flex items-center justify-center"></div>
            <!-- Row 2 -->
            <div class="square-light flex items-center justify-center"><span class="piece">♙</span></div>
            <div class="square-dark flex items-center justify-center"><span class="piece">♙</span></div>
            <div class="square-light flex items-center justify-center"><span class="piece">♙</span></div>
            <div class="square-dark flex items-center justify-center"><span class="piece">♙</span></div>
            <div class="square-light flex items-center justify-center"></div>
            <div class="square-dark flex items-center justify-center"><span class="piece">♙</span></div>
            <div class="square-light flex items-center justify-center"><span class="piece">♙</span></div>
            <div class="square-dark flex items-center justify-center"><span class="piece">♙</span></div>
            <!-- Row 1 -->
            <div class="square-dark flex items-center justify-center"><span class="piece">♖</span></div>
            <div class="square-light flex items-center justify-center"></div>
            <div class="square-dark flex items-center justify-center"><span class="piece">♗</span></div>
            <div class="square-light flex items-center justify-center"><span class="piece">♕</span></div>
            <div class="square-dark flex items-center justify-center"><span class="piece">♔</span></div>
            <div class="square-light flex items-center justify-center"><span class="piece">♗</span></div>
            <div class="square-dark flex items-center justify-center"><span class="piece">♘</span></div>
            <div class="square-light flex items-center justify-center"><span class="piece">♖</span></div>
          </div>
        </div>

        <!-- Player Info -->
        <div class="w-full max-w-lg mt-2 flex items-center justify-between px-1">
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded bg-[#769656] flex items-center justify-center">
              <i data-lucide="user" class="w-4 h-4 text-white"></i>
            </div>
            <div>
              <p class="font-medium text-sm">You <span class="text-gray-500 font-normal">• White</span></p>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <div class="flex items-center text-lg">
              <span>♟♟</span>
              <span class="text-gray-600 ml-1 text-sm">+2</span>
            </div>
            <div class="bg-[#769656] px-3 py-1.5 rounded font-mono text-xl font-medium text-white">
              4:58
            </div>
          </div>
        </div>

        <!-- Game Controls (Mobile) -->
        <div class="flex gap-2 mt-4 lg:hidden w-full max-w-lg">
          <button class="flex-1 flex items-center justify-center gap-2 py-2.5 px-3 rounded bg-[#2a2a2a] hover:bg-[#333] transition text-sm">
            <i data-lucide="rotate-ccw" class="w-4 h-4 text-gray-400"></i>
            Takeback
          </button>
          <button class="flex-1 flex items-center justify-center gap-2 py-2.5 px-3 rounded bg-[#2a2a2a] hover:bg-[#333] transition text-sm">
            <i data-lucide="handshake" class="w-4 h-4 text-gray-400"></i>
            Draw
          </button>
          <button class="flex-1 flex items-center justify-center gap-2 py-2.5 px-3 rounded bg-[#2a2a2a] hover:bg-[#333] transition text-sm">
            <i data-lucide="flag" class="w-4 h-4 text-gray-400"></i>
            Resign
          </button>
        </div>
      </div>

      <!-- Right: Sidebar -->
      <div class="w-full lg:w-72 flex flex-col gap-3">
        <!-- Move History -->
        <div class="card-minimal rounded-lg p-4 flex-1">
          <div class="flex items-center justify-between mb-3">
            <h3 class="font-medium text-sm text-gray-400">Moves</h3>
            <div class="flex items-center gap-1">
              <button class="p-1.5 hover:bg-[#2a2a2a] rounded transition text-gray-500 hover:text-white">
                <i data-lucide="chevrons-left" class="w-4 h-4"></i>
              </button>
              <button class="p-1.5 hover:bg-[#2a2a2a] rounded transition text-gray-500 hover:text-white">
                <i data-lucide="chevron-left" class="w-4 h-4"></i>
              </button>
              <button class="p-1.5 hover:bg-[#2a2a2a] rounded transition text-gray-500 hover:text-white">
                <i data-lucide="chevron-right" class="w-4 h-4"></i>
              </button>
              <button class="p-1.5 hover:bg-[#2a2a2a] rounded transition text-gray-500 hover:text-white">
                <i data-lucide="chevrons-right" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
          <div class="space-y-0.5 font-mono text-sm max-h-48 overflow-y-auto">
            <div class="flex items-center py-1.5 px-2 rounded hover:bg-[#2a2a2a]">
              <span class="text-gray-600 w-8">1.</span>
              <span class="flex-1">e4</span>
              <span class="flex-1">e5</span>
            </div>
            <div class="flex items-center py-1.5 px-2 rounded hover:bg-[#2a2a2a]">
              <span class="text-gray-600 w-8">2.</span>
              <span class="flex-1">Nf3</span>
              <span class="flex-1">Nc6</span>
            </div>
            <div class="flex items-center py-1.5 px-2 rounded bg-[#769656]/20 text-[#a3be7a]">
              <span class="text-gray-600 w-8">3.</span>
              <span class="flex-1 font-medium">Nc3</span>
              <span class="flex-1 text-gray-500">...</span>
            </div>
          </div>
        </div>

        <!-- Evaluation Bar (Vertical) -->
        <div class="card-minimal rounded-lg p-4">
          <div class="flex items-center justify-between mb-2">
            <h3 class="font-medium text-sm text-gray-400">Evaluation</h3>
            <span class="font-mono text-sm font-semibold text-[#769656]">+0.4</span>
          </div>
          <div class="h-2 bg-[#2a2a2a] rounded-full overflow-hidden">
            <div class="h-full bg-white rounded-full" style="width: 55%"></div>
          </div>
        </div>

        <!-- AI Info -->
        <div class="card-minimal rounded-lg p-4">
          <div class="flex items-center gap-3 mb-3">
            <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-red-500 to-orange-500 flex items-center justify-center">
              <i data-lucide="swords" class="w-5 h-5 text-white"></i>
            </div>
            <div>
              <p class="font-medium text-sm">Aggressive</p>
              <p class="text-xs text-gray-500">AI Personality</p>
            </div>
          </div>
          <div class="space-y-2 text-xs">
            <div class="flex justify-between items-center">
              <span class="text-gray-500">Attack</span>
              <div class="flex items-center gap-2">
                <div class="w-16 h-1.5 bg-[#2a2a2a] rounded-full overflow-hidden">
                  <div class="h-full bg-red-500 rounded-full" style="width: 85%"></div>
                </div>
                <span class="text-gray-300 w-8 text-right">85</span>
              </div>
            </div>
            <div class="flex justify-between items-center">
              <span class="text-gray-500">Defense</span>
              <div class="flex items-center gap-2">
                <div class="w-16 h-1.5 bg-[#2a2a2a] rounded-full overflow-hidden">
                  <div class="h-full bg-blue-500 rounded-full" style="width: 30%"></div>
                </div>
                <span class="text-gray-300 w-8 text-right">30</span>
              </div>
            </div>
            <div class="flex justify-between items-center">
              <span class="text-gray-500">Randomness</span>
              <div class="flex items-center gap-2">
                <div class="w-16 h-1.5 bg-[#2a2a2a] rounded-full overflow-hidden">
                  <div class="h-full bg-purple-500 rounded-full" style="width: 15%"></div>
                </div>
                <span class="text-gray-300 w-8 text-right">15</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Game Controls (Desktop) -->
        <div class="hidden lg:flex flex-col gap-2">
          <div class="flex gap-2">
            <button class="flex-1 flex items-center justify-center gap-2 py-2.5 px-3 rounded bg-[#2a2a2a] hover:bg-[#333] transition text-sm">
              <i data-lucide="rotate-ccw" class="w-4 h-4 text-gray-400"></i>
              Takeback
            </button>
            <button class="flex-1 flex items-center justify-center gap-2 py-2.5 px-3 rounded bg-[#2a2a2a] hover:bg-[#333] transition text-sm">
              <i data-lucide="handshake" class="w-4 h-4 text-gray-400"></i>
              Draw
            </button>
          </div>
          <button class="w-full flex items-center justify-center gap-2 py-2.5 px-3 rounded bg-red-900/30 hover:bg-red-900/50 text-red-400 transition text-sm border border-red-900/50">
            <i data-lucide="flag" class="w-4 h-4"></i>
            Resign
          </button>
        </div>
      </div>
    </div>
  </main>

  <script>lucide.createIcons();</script>
</body>
</html>
